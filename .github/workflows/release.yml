name: Release desktop apps

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop
          workspaces: "./src-tauri -> target"
      - uses: actions/cache@v5
        id: tinymist-cache
        with:
          path: src-tauri/binaries
          key: tinymist-v0.15.2-${{ runner.os }}-${{ runner.arch }}
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - name: Prepare pinned Tinymist sidecar
        if: steps.tinymist-cache.outputs.cache-hit != 'true'
        run: node scripts/prepare-tinymist.mjs
      - uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Typst Presenter ${{ github.ref_name }}
          releaseBody: See the changelog and attached installers for each platform.
          releaseDraft: true
          prerelease: false

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Publish only after every platform succeeds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
