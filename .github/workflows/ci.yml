name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop
          workspaces: "./src-tauri -> target"
      - uses: actions/cache@v5
        id: tinymist-cache
        with:
          path: src-tauri/binaries
          key: tinymist-v0.15.2-${{ runner.os }}-${{ runner.arch }}
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - name: Prepare pinned Tinymist sidecar
        if: steps.tinymist-cache.outputs.cache-hit != 'true'
        run: node scripts/prepare-tinymist.mjs
      - run: npm run lint
      - run: npm test
      - name: Smoke-test Tinymist LSP and Web preview
        run: npm run smoke:tinymist
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
