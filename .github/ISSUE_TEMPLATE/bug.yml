name: Bug report
description: Report reproducible broken behavior
labels: [needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the visible behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the smallest possible .typ source or repository link.
      placeholder: |
        1. Open…
        2. Save…
        3. Observe…
    validations:
      required: true
  - type: input
    id: typst
    attributes:
      label: Typst version
      placeholder: typst 0.15.1
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Operating system
      options: [Linux, macOS, Windows]
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Paste build diagnostics or application logs if available.
